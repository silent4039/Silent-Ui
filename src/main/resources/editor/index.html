<title>Silent UI Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: editor shell — top bar, tool rail, canvas stage + timeline dock, inspector, status line. Dark-first, single look. */
:root{
  /* Monochrome: black, white and greys only. White marks what is selected or active. */
  color-scheme: dark;
  --bg:#0a0a0a; --stage:#050505; --panel:#0f0f0f; --panel2:#161616; --raise:#1c1c1c; --line:#222222; --line2:#2f2f2f;
  --text:#f2f2f2; --muted:#8f8f8f; --faint:#5e5e5e;
  --accent:#ffffff; --accent-ink:#000000; --accent-soft:rgba(255,255,255,.08);
  --blue:#d6d6d6; --violet:#bdbdbd; --ok:#ededed; --warn:#cfcfcf; --danger:#c9c9c9;
  --ui:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --mc:'Pixelify Sans','Courier New',monospace;
  --r:8px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 var(--ui);overflow:hidden;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

#app{display:grid;height:100%;grid-template-columns:56px minmax(0,1fr) 304px;grid-template-rows:48px minmax(0,1fr) 26px;
  grid-template-areas:"top top top" "rail main side" "status status status"}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.2px;margin-right:10px;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:700 13px var(--mc)}
.brand .tag{font-size:10px;font-weight:800;background:var(--text);color:var(--bg);padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.6px}
.menus{display:flex;gap:2px}
.menu{position:relative}
.menu>button{background:none;border:0;color:var(--muted);padding:6px 9px;border-radius:6px}
.menu>button:hover,.menu.open>button{background:var(--raise);color:var(--text)}
.dropdown{position:absolute;top:34px;left:0;min-width:220px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:5px;z-index:50;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.dropdown button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:7px 9px;border-radius:6px;text-align:left;color:var(--text);gap:16px}
.dropdown button:hover{background:var(--accent-soft)}
.dropdown kbd{font:11px var(--mono);color:var(--faint)}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.top-mid{flex:1;display:flex;justify-content:center;min-width:0}
.docname{background:none;border:1px solid transparent;border-radius:6px;padding:4px 8px;text-align:center;font-weight:700;max-width:260px;min-width:60px}
.docname:hover,.docname:focus{border-color:var(--line2);background:var(--panel2)}
.top-right{display:flex;gap:6px;align-items:center}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;border:0;background:none;color:var(--muted)}
.icon-btn:hover{background:var(--raise);color:var(--text)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.icon-btn svg{width:17px;height:17px}
.btn{border:1px solid var(--line2);background:var(--raise);border-radius:7px;padding:6px 11px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none}
.btn.danger{color:var(--muted)}
.btn.danger:hover{color:var(--text);border-color:var(--text)}
.btn.sm{padding:3px 8px;font-size:12px}

#rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
#rail .icon-btn{width:38px;height:38px;border-radius:9px}
#rail .sep{width:24px;border-top:1px solid var(--line);margin:6px 0}
#rail .grow{flex:1}

#main{grid-area:main;display:grid;grid-template-rows:38px minmax(0,1fr) auto;min-width:0;min-height:0;position:relative}
#tabs{display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;font-weight:600;font-size:12px}
.tab.active{background:var(--raise);border-color:var(--line2)}
.tab .typ{font:10px var(--mono);color:var(--accent);text-transform:uppercase}
.tab .x{border:0;background:none;color:var(--faint);width:18px;height:18px;border-radius:4px;line-height:1}
.tab .x:hover{background:var(--line2);color:var(--text)}
#stage{position:relative;overflow:hidden;background:var(--stage);touch-action:none}
#stage.panning{cursor:grabbing}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
.artboard{position:absolute;left:0;top:0;outline:1px solid var(--line2);
  background-color:#141218;background-image:linear-gradient(45deg,#1b1920 25%,transparent 25%,transparent 75%,#1b1920 75%),linear-gradient(45deg,#1b1920 25%,transparent 25%,transparent 75%,#1b1920 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
.artboard .hudmid{position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed rgba(255,143,209,.25);pointer-events:none}
.artboard-label{position:absolute;top:-22px;left:0;font:11px var(--mono);color:var(--muted);white-space:nowrap}
.el{position:absolute;image-rendering:pixelated}
.el .bg{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated}
.el .fillbar{position:absolute;left:0;top:0;bottom:0;background-size:100% 100%;image-rendering:pixelated}
.el .lbl{position:absolute;inset:0;display:flex;align-items:center;font-family:var(--mc);white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none;line-height:1}
.el.hidden-el{outline:1px dashed var(--faint);opacity:.28!important}
.el .ph{position:absolute;inset:0;display:grid;place-items:center;background:rgba(143,200,255,.08);outline:1px dashed rgba(143,200,255,.4);font:9px var(--mono);color:var(--blue);text-align:center;overflow:hidden}
.sel{position:absolute;pointer-events:none;outline:calc(1.5px * var(--inv)) solid var(--accent)}
.sel.multi{outline-style:dashed}
.handle{position:absolute;width:calc(9px * var(--inv));height:calc(9px * var(--inv));background:var(--bg);border:calc(1.5px * var(--inv)) solid var(--accent);border-radius:calc(2px * var(--inv));pointer-events:auto;transform:translate(-50%,-50%)}
.handle.rot{border-radius:50%;background:var(--accent)}
.rotline{position:absolute;left:50%;width:0;border-left:calc(1px * var(--inv)) solid var(--accent);top:calc(-18px * var(--inv));height:calc(18px * var(--inv))}
.guide{position:absolute;background:var(--blue);pointer-events:none}
.marquee{position:absolute;border:1px solid var(--accent);background:var(--accent-soft);pointer-events:none}
.hoverbox{position:absolute;pointer-events:none;outline:calc(1px * var(--inv)) solid rgba(143,200,255,.7)}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;align-items:center}
.zoomctl span{font:11px var(--mono);color:var(--muted);min-width:44px;text-align:center}
.zoomctl .icon-btn{width:26px;height:26px}
.hint{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--faint);pointer-events:none}

#side{grid-area:side;border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.sidetabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.sidetabs button{flex:1;background:none;border:0;padding:8px 4px 9px;color:var(--muted);font-weight:700;border-bottom:2px solid transparent}
.sidetabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#panel{overflow-y:auto;padding:4px 0 30px}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 10px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:7px}
.row label,.lab{color:var(--muted);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:7px}
.num{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 0 0 8px;min-width:0}
.num b{font:600 11px var(--mono);color:var(--faint);cursor:ew-resize;user-select:none;min-width:12px;margin-right:2px}
input[type=color].inp{width:56px;height:30px;padding:2px;flex:none}
.num input{border:0;background:none;width:100%;min-width:0;padding:6px 6px;font:12px var(--mono)}
.num.keyed{border-color:var(--accent)}
.inp,select.inp,textarea.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;min-width:0}
textarea.inp{resize:vertical;min-height:54px;font-family:var(--mono)}
.inp:focus,.num:focus-within{border-color:var(--accent);outline:none}
.color{display:flex;gap:6px;align-items:center}
.color input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:2px}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);margin-bottom:7px;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:4px 6px;border-radius:5px;color:var(--muted);font-size:12px;font-weight:600}
.seg button.on{background:var(--raise);color:var(--text)}
.anchor{display:grid;grid-template-columns:repeat(3,22px);gap:4px}
.anchor button{width:22px;height:22px;border:1px solid var(--line2);background:var(--panel2);border-radius:5px;padding:0}
.anchor button.on{background:var(--accent);border-color:var(--accent)}
.empty{color:var(--faint);padding:30px 14px;text-align:center}
.layers{list-style:none;margin:0;padding:6px}
.layer{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.layer:hover{background:var(--panel2)}
.layer.on{background:var(--accent-soft);border-color:rgba(255,143,209,.35)}
.layer.drop-above{box-shadow:inset 0 2px 0 var(--accent)}
.layer.drop-below{box-shadow:inset 0 -2px 0 var(--accent)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .ty{font:10px var(--mono);color:var(--faint)}
.layer .mini{width:24px;height:24px;border:0;background:none;color:var(--faint);border-radius:5px;display:grid;place-items:center}
.layer .mini:hover{color:var(--text);background:var(--line)}
.layer .mini svg{width:14px;height:14px}
.layer .mini.off{color:var(--text)}

#status{grid-area:status;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);font:11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden}
#status .sp{flex:1}

/* timeline dock */
#dock{border-top:1px solid var(--line);background:var(--panel);height:230px;display:grid;grid-template-rows:38px minmax(0,1fr);min-height:0}
#dock[hidden]{display:none!important}
.dockbar{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.dockbar .time{font:12px var(--mono);color:var(--text);min-width:86px}
.dockbar select,.dockbar input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px}
.tl{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0;overflow:hidden}
.tl-left{border-right:1px solid var(--line);overflow-y:auto}
.tl-row{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;font-size:12px;color:var(--muted);border-bottom:1px solid rgba(38,34,46,.6)}
.tl-row.head{color:var(--text);font-weight:700;background:var(--panel2);height:26px}
.tl-row button{border:0;background:none;color:var(--faint);font-size:15px;width:20px;height:20px;border-radius:4px;line-height:1}
.tl-row button:hover{color:var(--accent);background:var(--line)}
.tl-right{position:relative;overflow:auto}
.ruler{position:sticky;top:0;height:26px;background:var(--panel2);border-bottom:1px solid var(--line);z-index:2;cursor:pointer}
.ruler span{position:absolute;top:6px;font:10px var(--mono);color:var(--faint);transform:translateX(-50%)}
.ruler i{position:absolute;bottom:0;width:1px;height:6px;background:var(--line2)}
.track{height:28px;position:relative;border-bottom:1px solid rgba(38,34,46,.6)}
.track .bar{position:absolute;top:13px;height:2px;background:var(--line2)}
.kf{position:absolute;top:8px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);background:var(--blue);border:2px solid var(--panel);cursor:grab}
.kf.on{background:var(--accent)}
.playhead{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--accent);pointer-events:none;z-index:3}
.playhead::before{content:"";position:absolute;top:0;left:-6px;border:6px solid transparent;border-top:8px solid var(--accent)}
.endline{position:absolute;top:0;bottom:0;border-left:1px dashed var(--faint);pointer-events:none}

/* script editor */
#script{position:absolute;inset:0;background:var(--bg);display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:44px minmax(0,1fr);z-index:20}
#script[hidden]{display:none!important}
.sc-top{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.sc-top .ttl{font-weight:700;flex:1}
.palette{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px}
.palette .grp{margin:12px 2px 4px;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.palette .grp i{width:7px;height:7px;border-radius:50%}
.palette button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 8px;border-radius:6px;color:var(--text);font-size:12.5px}
.palette button:hover{background:var(--raise)}
#nodes{position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;touch-action:none}
#nodeLayer{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--accent);stroke-width:2.2;pointer-events:stroke;cursor:pointer}
#wires path.f{stroke:#8f8f8f;stroke-dasharray:5 4}
#wires path.t{stroke:#ffffff}
#wires path:hover{stroke-width:4}
#wires path.temp{stroke-dasharray:6 5;pointer-events:none}
.node{position:absolute;width:236px;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.node.on{border-color:var(--accent)}
.node .nh{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:grab;font-weight:700;font-size:12.5px}
.node .nh i{width:9px;height:9px;border-radius:3px;flex:none}
.node .nh .del{margin-left:auto;border:0;background:none;color:var(--faint);width:20px;height:20px;border-radius:4px}
.node .nh .del:hover{color:var(--danger);background:var(--line)}
.node .nb{padding:8px 10px 6px}
.node .nf{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px;align-items:center;margin-bottom:6px;font-size:11.5px;color:var(--muted)}
.node .nf .inp{padding:4px 6px;font-size:11.5px}
.node .outs{display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding:2px 0 8px}
.node .out{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-right:-17px}
.port{width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--faint);cursor:crosshair}
.port.in{position:absolute;left:-7px;top:12px}
.out .port{border-color:var(--accent)}
.out.true .port{border-color:#fff;background:#fff}
.out.false .port{border-color:#8f8f8f}
.node.drop{box-shadow:0 0 0 2px var(--accent)}

/* server chip, page strip, assets */
.srv{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;background:none;white-space:nowrap}
.srv i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.srv.on i{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.pages{position:absolute;left:12px;top:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:4;max-width:calc(100% - 24px)}
.pages .set{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.pages .set b{font:600 11px var(--mono);color:var(--faint);padding:0 6px}
.pages .set button{border:0;background:none;color:var(--muted);font-size:12px;padding:3px 8px;border-radius:5px}
.pages .set button.on{background:#fff;color:#000}
.grid-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;max-height:52vh;overflow:auto;padding:2px}
.icon-cell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.icon-cell:hover,.icon-cell.on{border-color:#fff}
.icon-cell img{width:40px;height:40px;image-rendering:pixelated}
.icon-cell span{font-size:10.5px;color:var(--muted);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 4px}
.mtabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:7px 10px;font-weight:600}
.mtabs button.on{color:var(--text);border-bottom-color:#fff}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.preset{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.preset .pv{height:120px;background:var(--stage);position:relative;overflow:hidden}
.preset .pv .mini{position:absolute;left:50%;top:50%;transform-origin:0 0}
.preset .meta{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.preset .meta b{font-size:13px}
.preset .meta span{font-size:11.5px;color:var(--muted)}
.preset .acts{display:flex;gap:6px;padding:0 10px 10px}
.cmd-row{display:grid;grid-template-columns:1fr 110px 1fr 70px 1fr 28px;gap:6px;align-items:center;margin-bottom:6px}
.cmd-row .inp{padding:5px 6px}
.chip{display:inline-flex;align-items:center;gap:4px;font:11px var(--mono);border:1px solid var(--line2);border-radius:999px;padding:1px 7px;color:var(--muted)}
details.adv>summary{cursor:pointer;list-style:none;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
details.adv>summary::after{content:"+";color:var(--faint)}
details.adv[open]>summary::after{content:"−"}
details.adv>summary::-webkit-details-marker{display:none}
.logic-note{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}
.logic-note b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(5,4,8,.66);display:grid;place-items:center;z-index:100;padding:16px}
.modal{width:min(620px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800}
.modal .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.modal p{margin:0;color:var(--muted)}
.modal pre,.modal textarea.code{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:10px;font:11.5px/1.5 var(--mono);color:var(--text);max-height:340px;overflow:auto;width:100%;white-space:pre}
.sprites{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.sprite{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.sprite .th{height:72px;border-radius:6px;display:grid;place-items:center;background-color:#141218;background-image:linear-gradient(45deg,#1b1920 25%,transparent 25%,transparent 75%,#1b1920 75%),linear-gradient(45deg,#1b1920 25%,transparent 25%,transparent 75%,#1b1920 75%);background-size:12px 12px;background-position:0 0,6px 6px}
.sprite .th img{max-width:90%;max-height:64px;image-rendering:pixelated}
.sprite .meta{font:10px var(--mono);color:var(--faint)}
.sprite .acts{display:flex;gap:4px}
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--accent)}
.toasts{position:fixed;right:16px;bottom:34px;display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--raise);border:1px solid var(--line2);padding:9px 13px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:600;max-width:360px}
.toast.err{border-color:#fff;background:#2a2a2a}
.toast.ok{border-color:var(--line2)}

/* preview */
#preview{position:absolute;inset:0;z-index:30;background:radial-gradient(120% 90% at 50% 0%,#3b5a3a 0%,#22331f 45%,#121a10 100%);overflow:hidden;cursor:crosshair}
#preview[hidden]{display:none!important}
#preview .scene{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 40px,transparent 40px 80px);pointer-events:none}
#preview .pv-board{position:absolute;transform-origin:0 0}
#preview .pv-dim{position:absolute;inset:0;background:#000;pointer-events:none}
#preview .chat{position:absolute;left:12px;bottom:46px;display:flex;flex-direction:column;gap:2px;max-width:60%;pointer-events:none}
#preview .chat div{background:rgba(0,0,0,.45);padding:2px 6px;font:13px var(--mc);color:#fff}
#preview .pv-bar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(10,9,13,.8);border:1px solid var(--line2);border-radius:10px;padding:5px 6px 5px 12px;font-size:12px;z-index:5;cursor:default}
#preview .hotbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:2px;pointer-events:none}
#preview .hotbar i{width:30px;height:30px;background:rgba(0,0,0,.45);border:2px solid rgba(120,120,120,.6)}
#preview .hotbar i.on{border-color:#fff}
#preview .xhair{position:absolute;width:15px;height:15px;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:difference}
#preview .xhair::before,#preview .xhair::after{content:"";position:absolute;background:#fff}
#preview .xhair::before{left:7px;top:0;width:1px;height:15px}
#preview .xhair::after{top:7px;left:0;height:1px;width:15px}
#preview .pv-title{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:700 42px var(--mc);color:#fff;text-shadow:3px 3px 0 #3f3f3f;text-align:center}
#preview .pv-fade{position:absolute;inset:0;pointer-events:none;opacity:0}
#preview .bossbar{position:absolute;left:50%;top:0;width:0;height:0}

@media (max-width: 860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:48px 46px minmax(0,1fr) 42vh 24px;grid-template-areas:"top" "rail" "main" "side" "status"}
  #rail{flex-direction:row;padding:0 8px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
  #rail .sep{width:0;height:22px;border-top:0;border-left:1px solid var(--line);margin:0 4px}
  #rail .grow{display:none}
  #side{border-left:0;border-top:1px solid var(--line)}
  .menus .menu:nth-child(n+3){display:none}
  .brand .tag,.top-right .hide-sm{display:none}
  .tl{grid-template-columns:130px minmax(0,1fr)}
  #script{grid-template-columns:150px minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

const LEGACY = {'0': 'black', '1': 'dark_blue', '2': 'dark_green', '3': 'dark_aqua', '4': 'dark_red', '5': 'dark_purple', '6': 'gold', '7': 'gray', '8': 'dark_gray', '9': 'blue', a: 'green', b: 'aqua', c: 'red', d: 'light_purple', e: 'yellow', f: 'white'};
function mmToHtml(src) {
  let s = String(src ?? '');
  if (s.includes('&') && !s.includes('<')) {
    s = s.replace(/&([0-9a-fk-or])/gi, (_, c) => { c = c.toLowerCase(); return LEGACY[c] ? `<${LEGACY[c]}>` : c === 'l' ? '<bold>' : c === 'o' ? '<italic>' : c === 'n' ? '<underlined>' : c === 'r' ? '<reset>' : ''; });
  }
  let out = '', stack = 0;
  const re = /<(\/?)([#a-z_0-9:]+)>/gi;
  let last = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    last = re.lastIndex;
    const close = m[1] === '/', tag = m[2].toLowerCase();
    if (close) { if (stack > 0) { out += '</span>'; stack--; } continue; }
    let style = null;
    if (/^#[0-9a-f]{6}$/.test(tag)) style = 'color:' + tag;
    else if (tag.startsWith('color:')) style = 'color:' + (NAMED[tag.slice(6)] || tag.slice(6));
    else if (NAMED[tag]) style = 'color:' + NAMED[tag];
    else if (tag === 'bold' || tag === 'b') style = 'font-weight:700';
    else if (tag === 'italic' || tag === 'i' || tag === 'em') style = 'font-style:italic';
    else if (tag === 'underlined' || tag === 'u') style = 'text-decoration:underline';
    else if (tag === 'strikethrough' || tag === 'st') style = 'text-decoration:line-through';
    else if (tag === 'reset') { out += '</span>'.repeat(stack); stack = 0; continue; }
    else if (tag === 'newline' || tag === 'br') { out += '\n'; continue; }
    if (style) { out += `<span style="${style}">`; stack++; }
  }
  out += esc(s.slice(last)) + '</span>'.repeat(stack);
  return out;
}

  if (p.server && SRV.token) { try { await fetch(srvBase() + '/api/presets/delete?id=' + encodeURIComponent(p.id), {method: 'POST', headers: {'X-SilentUI-Token': SRV.token}}); } catch { /* offline */ } }
}
function presetThumb(p) {
  const bb = bbox(p.elements);
  const k = Math.min(180 / Math.max(1, bb.w), 104 / Math.max(1, bb.h), 2);
  const mini = h('div', {class: 'mini', style: {width: bb.w + 'px', height: bb.h + 'px', transform: `scale(${k}) translate(${-bb.w / 2}px,${-bb.h / 2}px)`}});
  const spr = Object.fromEntries((p.sprites || []).map(s => [s.id, s.data]));
  for (const e of p.elements) {
    const v = Object.assign(defaultsFor(e.type), e, {x: e.x - bb.x, y: e.y - bb.y});
    const node = elNode(v, v, {preview: true, sprites: spr});
    if (offPagePreset(p, e)) node.style.display = 'none';
    mini.append(node);
  }
  return h('div', {class: 'pv'}, mini);
}
function offPagePreset(p, e) {
  const g = e.group || '', i = g.indexOf('/');
  if (i <= 0) return false;
  const set = g.slice(0, i), page = g.slice(i + 1);
  const def = (p.tabs || {})[set];

}

  d.settings.dim = 0.4;
  d.tabs = {shop: 'blocks'};
  d.sprites = [
    spr('panel', {w: 300, h: 210, r: 9, fill: '#121212', fill2: '#0b0b0b', vgrad: true, alpha: .96, border: '#3a3a3a', bw: 1}),
    spr('slot', {w: 54, h: 60, r: 6, fill: '#1e1e1e', alpha: .95}),
    spr('slot_hover', {w: 54, h: 60, r: 6, fill: '#2a2a2a', border: '#ffffff', bw: 1}),
    spr('x_btn', {w: 14, h: 14, r: 4, fill: '#1e1e1e', icon: 'close', iconColor: '#bdbdbd'}),
    spr('x_btn_hover', {w: 14, h: 14, r: 4, fill: '#ffffff', icon: 'close', iconColor: '#000000'})
  ];
  const X = 90, Y = 30;
  const E = [
    el('image', {id: 'panel', name: 'Panel', x: X, y: Y, w: 300, h: 210, sprite: 'panel', blocked: true}),
    el('text', {id: 'title', name: 'Title', x: X + 14, y: Y + 12, w: 120, h: 12, text: '<bold>Shop</bold>', align: 'left', blocked: true}),
    el('text', {id: 'coins', name: 'Coins', x: X + 140, y: Y + 13, w: 130, h: 10, text: '<gray>Coins</gray> {var:coins}', align: 'right', textSize: .85, blocked: true}),
    el('image', {id: 'close', name: 'Close', x: X + 278, y: Y + 10, w: 14, h: 14, sprite: 'x_btn', hoverSprite: 'x_btn_hover', hoverScale: 1.1})
  ];
  const cats = {blocks: [['grass_block', 4], ['oak_log', 6], ['stone_bricks', 5], ['glass', 3], ['bookshelf', 20], ['lantern', 12]],
    tools: [['diamond_sword', 120], ['diamond_pickaxe', 140], ['bow', 40], ['shield', 30], ['fishing_rod', 15], ['shears', 10]],
    food: [['golden_apple', 50], ['cooked_beef', 4], ['bread', 2], ['cake', 12], ['apple', 2], ['golden_carrot', 8]]};
  const nodes = [
    node('on_open', 40, 40, {__id: 'o1'}, {then: ['o2']}),
    node('if_var', 320, 40, {__id: 'o2', name: 'coins', op: '==', value: ''}, {true: ['o3']}),
    node('set_var', 600, 40, {__id: 'o3', name: 'coins', value: '250'}),
    node('on_click', 40, 280, {__id: 'c1', element: 'close'}, {then: ['c2']}),
    node('close_ui', 320, 280, {__id: 'c2'}),
    node('on_hover_enter', 40, 440, {__id: 'h1'}, {then: ['h2']}),
    node('sound', 320, 440, {__id: 'h2', sound: 'minecraft:block.note_block.hat', volume: '0.3', pitch: '1.8'})
  ];
  let ny = 700;
  Object.entries(cats).forEach(([cat, items], ci) => {
    E.push(el('button', {id: 'tab_' + cat, name: cat + ' tab', text: cat[0].toUpperCase() + cat.slice(1), tabFor: 'shop/' + cat,
      x: X + 14 + ci * 74, y: Y + 32, w: 70, h: 18, fill: '#1e1e1e', textColor: '#bdbdbd', activeFill: '#ffffff', activeTextColor: '#000000', hoverFill: '#2a2a2a', hoverScale: 1, shadow: false}));
    items.forEach(([id, price], i) => {
      const sx = X + 14 + (i % 5) * 0 + (i % 3) * 92, sy = Y + 60 + Math.floor(i / 3) * 70;
      const g = 'shop/' + cat;
      E.push(el('image', {id: `s_${cat}_${i}`, name: id + ' slot', group: g, x: sx, y: sy, w: 86, h: 64, sprite: 'slot', hoverSprite: 'slot_hover', hoverScale: 1.03}));
      E.push(el('item', {id: `i_${cat}_${i}`, name: id, group: g, x: sx + 8, y: sy + 16, w: 30, h: 30, item: 'minecraft:' + id, blocked: true, fillEnabled: false, rotatable: false}));
      E.push(el('text', {id: `n_${cat}_${i}`, name: id + ' name', group: g, x: sx + 42, y: sy + 18, w: 42, h: 20, text: id.replace(/_/g, ' '), textSize: .6, align: 'left', blocked: true}));
      E.push(el('text', {id: `p_${cat}_${i}`, name: id + ' price', group: g, x: sx + 42, y: sy + 42, w: 42, h: 9, text: '<white>' + price + '</white> <gray>c</gray>', textSize: .7, align: 'left', blocked: true}));
      nodes.push(node('on_click', 40, ny, {__id: `k_${cat}_${i}`, element: `s_${cat}_${i}`}, {then: [`f_${cat}_${i}`]}));
      nodes.push(node('call_function', 320, ny, {__id: `f_${cat}_${i}`, name: 'buy', args: `item=minecraft:${id}, price=${price}, label=${id.replace(/_/g, ' ')}`}));
      ny += 170;
    });
  });
  nodes.push(node('on_function', 40, ny, {__id: 'b1', name: 'buy'}, {then: ['b2']}));
  nodes.push(node('if_var', 320, ny, {__id: 'b2', name: 'coins', op: '>=', value: '{price}'}, {true: ['b3'], false: ['b6']}));
  nodes.push(node('add_var', 600, ny - 40, {__id: 'b3', name: 'coins', amount: '-{price}'}, {then: ['b4']}));
  nodes.push(node('give_item', 880, ny - 40, {__id: 'b4', item: '{item}', amount: '1'}, {then: ['b5']}));
  nodes.push(node('message', 1160, ny - 40, {__id: 'b5', text: '<white>Bought {label}</white> <gray>for {price} coins</gray>'}));
  nodes.push(node('sound', 600, ny + 160, {__id: 'b6', sound: 'minecraft:entity.villager.no', volume: '0.6', pitch: '1'}, {then: ['b7']}));
  nodes.push(node('message', 880, ny + 160, {__id: 'b7', text: "<gray>You can't afford {label}.</gray>"}));
  // /shop [category] opens the shop on a tab
  nodes.push(node('on_function', 40, ny + 360, {__id: 'q1', name: 'open_category'}, {then: ['q2']}));
  nodes.push(node('switch_tab', 320, ny + 360, {__id: 'q2', tabset: 'shop', page: '{arg:category}'}));
  d.elements = E;
  d.script.nodes = nodes;
  d.commands = [{name: 'shop', aliases: ['store'], permission: '', description: 'Open the shop', function: 'open_category', open: true,
    args: [{name: 'category', type: 'choice', choices: ['blocks', 'tools', 'food'], optional: true, def: 'blocks'}]}];
  return d;
}
(function boot() {
  const saved = store.get('docs', null);
  if (saved && Array.isArray(saved.docs) && saved.docs.length) {
    S.docs = saved.docs.map(normalize);
    S.cur = clamp(saved.cur || 0, 0, S.docs.length - 1);
  } else {
    S.docs = [tplShop(), tplMenu(), tplHud(), tplBoard()].map(normalize);
    S.cur = 0;
  }
  S.anim.id = doc().animations[0]?.id || null;
  render();
  requestAnimationFrame(fit);
  const base = serverDefault();
  if (base) connectServer(base, store.get('token', ''), true);
  else renderSrv();
})();
window.SilentUIEditor = {S, doc, exportJson, tplMenu, tplHud, tplBoard, tplShop, normalize, validate, BUILTIN_PRESETS, insertPreset, presetFromSelection, SRV, connectServer};
</script>
