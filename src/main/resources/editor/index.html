<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Silent UI · Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&family=Pixelify+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><div class="mark">S</div><span>silent<span class="brand-ui">ui</span><small>STUDIO</small></span></div>
    <nav class="menus" id="menus"></nav>
    <div class="top-mid"><input class="docname" id="docname" aria-label="UI name" spellcheck="false"><span id="saveState" class="save-state" role="status" aria-live="polite">Saved locally</span></div>
    <div class="top-right">
      <button class="icon-btn" id="searchBtn" title="Find a command (Ctrl+K)" aria-label="Find a command">⌕</button><button class="srv" id="srvChip" title="Server connection"><i></i><span>Offline</span></button>
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="btn ghost hide-sm" id="previewBtn" title="Preview (P)">Preview</button>
      <button class="btn ghost" id="exportBtn">Export JSON</button>
      <button class="btn primary" id="pushBtn">Push to server <span aria-hidden="true">↗</span></button>
    </div>
  </header>
  <aside id="navigator" aria-label="Document navigation">
    <div class="nav-tabs" role="tablist" aria-label="Workspace panels"><button id="layersTab" role="tab" aria-selected="true">Layers</button><button id="insertTab" role="tab" aria-selected="false">Insert</button></div>
    <div id="navigatorBody"></div>
    <div class="nav-bottom"><button class="btn ghost" id="templatesBtn">Browse templates <span>↗</span></button><button class="icon-btn" id="helpBtn" title="Help and shortcuts" aria-label="Help and shortcuts">?</button></div>
  </aside>
  <section id="main">
    <div id="tabs" role="tablist" aria-label="Open documents"></div>
    <div id="workspacebar"><div class="workspace-tools" id="rail" role="toolbar" aria-label="Canvas tools"></div><div class="workspace-actions"><button class="btn sm ghost" id="gridBtn" aria-pressed="false" title="Show grid">Grid</button><button class="btn sm ghost" id="fitBtn" title="Fit canvas (Shift+1)">Fit canvas</button></div></div>
    <div id="stage">
      <div id="board"></div>
      <div id="emptyCanvas" hidden></div>
      <div class="hint" id="hint">Space + drag to pan · Ctrl + scroll to zoom</div>
      <div class="zoomctl">
        <button class="icon-btn" id="zoomOut" title="Zoom out">−</button>
        <span id="zoomLbl">100%</span>
        <button class="icon-btn" id="zoomIn" title="Zoom in">+</button>
        <button class="icon-btn" id="zoomFit" title="Fit (Shift+1)">⤢</button>
      </div>
    </div>
    <div id="dock" hidden></div>
    <div id="script" hidden></div>
    <div id="preview" hidden></div>
  </section>
  <aside id="side">
    <div class="sidetabs" id="sidetabs">
      <button data-t="props" class="on">Inspect</button>
      <button data-t="settings">UI settings</button>
      <button data-t="slots" hidden>Slots</button>
    </div>
    <div id="panel"></div>
  </aside>
  <footer id="status"></footer>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="fileOpen" accept=".json,application/json" hidden>
<input type="file" id="fileSprite" accept="image/png,image/*" multiple hidden>
<script src="editor.js"></script>
</body>
</html>
