name: Build

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        id: mvn
        run: |
          set -o pipefail
          mvn -B -ntp package 2>&1 | tee build.log
        continue-on-error: true

      - name: Report compile errors
        if: steps.mvn.outcome == 'failure'
        run: |
          # One annotation holding all compiler errors (readable without logging in).
          ERRS=$(grep -E '^\[ERROR\] .*\.java:\[' build.log | sed 's#.*/src/main/java/##' | head -60 || true)
          if [ -z "$ERRS" ]; then ERRS=$(grep -E '^\[ERROR\]' build.log | head -40); fi
          ERRS="${ERRS//'%'/'%25'}"
          ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Build failed::$ERRS"
          exit 1

      - name: Test summary
        run: echo "::notice title=Tests::$(grep -E 'Tests run:' build.log | tail -1 | sed 's/^\[[A-Z]*\] //')"

      - uses: actions/upload-artifact@v4
        with:
          name: SilentUI
          path: target/SilentUI-*.jar

      - name: Publish jar to builds/<branch>
        # A plain git branch is the easiest download for tools that can't reach GitHub's artifact storage.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          BR="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          mkdir -p /tmp/out && cp target/SilentUI-*.jar /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b out
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -q -m "SilentUI jar for ${BR} at ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "out:refs/heads/builds/${BR}"

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest target/SilentUI-*.jar \
            --title "Silent UI (latest build)" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Drop the jar into your server's plugins folder." \
            --prerelease

      - name: Publish a preview release for this branch
        # Lets you download and test a pull request's jar before it is merged (tag: preview-<branch>).
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TAG="preview-$(echo "$BRANCH" | tr '/' '-')"
          gh release delete "$TAG" --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" target/SilentUI-*.jar --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Silent UI preview ($BRANCH)" \
            --notes "Test build of $BRANCH at ${SHA::7}. Not merged into main yet." \
            --prerelease

  editor-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-test-results
          path: test-results/

  render-check:
    # Renders a contact sheet of vanilla icons with the real client jar and pushes it to the ci-output branch.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Render icons
        env:
          SILENTUI_RENDER: '1'
        run: |
          set -o pipefail
          mvn -B -ntp test -Dtest=IconSheetTest -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee render.log || {
            ERRS=$(grep -E '^\[ERROR\]' render.log | head -30); ERRS="${ERRS//$'\n'/'%0A'}"; echo "::error title=Render failed::$ERRS"; exit 1; }
      - name: Publish sheet
        if: always()
        run: |
          [ -f target/icon-sheet.png ] || exit 0
          mkdir -p /tmp/out && cp target/icon-sheet.png /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b ci-output
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -q -m "icon sheet for ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-output
